name: Update immigration news

on:
  schedule:
    # Every 6 hours. Edit this cron to change frequency (cron is UTC).
    - cron: "17 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data if changed
        run: |
          git config user.name "immigration-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- docs/data/news.json; then
            echo "No changes to commit."
          else
            git add docs/data/news.json
            git commit -m "Update immigration news data [automated]"
            git push
          fi
